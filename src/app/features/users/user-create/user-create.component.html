<!-- Backdrop -->
<div class="modal-backdrop" (click)="onCancel()"
  style="position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
         padding:16px; background:rgba(15,23,42,0.45); backdrop-filter:blur(2px);">

  <!-- Panel -->
  <div class="modal-panel" (click)="$event.stopPropagation()"
    style="width:100%; max-width:520px; background:#fff; border-radius:14px;
           box-shadow:0 20px 60px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05);
           overflow:hidden;">

    <!-- Header -->
    <div style="display:flex; align-items:center; justify-content:space-between;
                padding:18px 24px; border-bottom:1px solid #f1f5f9;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:36px; height:36px; background:#eff6ff; border-radius:9px;
                    display:flex; align-items:center; justify-content:center;">
          <svg width="18" height="18" fill="none" stroke="#2563eb" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div>
          <p style="margin:0; font-size:14px; font-weight:700; color:#0f172a; letter-spacing:-0.01em;">Add New Client</p>
          <p style="margin:2px 0 0; font-size:12px; color:#94a3b8;">Enter the client's basic information</p>
        </div>
      </div>
      <button id="btn-close-create-modal" (click)="onCancel()"
        style="width:30px; height:30px; border:none; background:transparent; border-radius:6px;
               cursor:pointer; display:flex; align-items:center; justify-content:center; color:#94a3b8;"
        onmouseover="this.style.background='#f1f5f9'; this.style.color='#475569'"
        onmouseout="this.style.background='transparent'; this.style.color='#94a3b8'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" style="padding:24px; display:flex; flex-direction:column; gap:16px;">

      <!-- Error -->
      @if (errorMessage()) {
        <div style="display:flex; align-items:center; gap:8px; background:#fef2f2; border:1px solid #fecaca;
                    color:#dc2626; padding:10px 14px; border-radius:8px; font-size:13px;">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ errorMessage() }}
        </div>
      }

      <!-- Row 1 -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div>
          <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:6px;" for="c-name">
            Full Name <span style="color:#dc2626;">*</span>
          </label>
          <input id="c-name" type="text" formControlName="name" placeholder="Jane Smith"
            [style]="isInvalid('name') ? 'border-color:#f87171; box-shadow:0 0 0 3px rgba(248,113,113,0.15);' : ''"
            style="width:100%; border:1px solid #e2e8f0; border-radius:8px; padding:8px 12px; font-size:13px;
                   color:#0f172a; font-family:inherit; outline:none; background:#fff; box-sizing:border-box;"
            onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.1)'"
            onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none'"/>
          @if (isInvalid('name')) {
            <p style="margin:5px 0 0; font-size:11px; color:#ef4444;">Minimum 2 characters required.</p>
          }
        </div>
        <div>
          <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:6px;" for="c-email">
            Email Address <span style="color:#dc2626;">*</span>
          </label>
          <input id="c-email" type="email" formControlName="email" placeholder="jane@example.com"
            [style]="isInvalid('email') ? 'border-color:#f87171; box-shadow:0 0 0 3px rgba(248,113,113,0.15);' : ''"
            style="width:100%; border:1px solid #e2e8f0; border-radius:8px; padding:8px 12px; font-size:13px;
                   color:#0f172a; font-family:inherit; outline:none; background:#fff; box-sizing:border-box;"
            onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.1)'"
            onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none'"/>
          @if (isInvalid('email')) {
            <p style="margin:5px 0 0; font-size:11px; color:#ef4444;">Enter a valid email address.</p>
          }
        </div>
      </div>

      <!-- Row 2 -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div>
          <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:6px;" for="c-phone">Phone</label>
          <input id="c-phone" type="tel" formControlName="phone" placeholder="+1 555 000 0000"
            style="width:100%; border:1px solid #e2e8f0; border-radius:8px; padding:8px 12px; font-size:13px;
                   color:#0f172a; font-family:inherit; outline:none; background:#fff; box-sizing:border-box;"
            onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.1)'"
            onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none'"/>
        </div>
        <div>
          <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:6px;" for="c-age">Age</label>
          <input id="c-age" type="number" formControlName="age" placeholder="e.g. 28" min="0" max="120"
            [style]="isInvalid('age') ? 'border-color:#f87171;' : ''"
            style="width:100%; border:1px solid #e2e8f0; border-radius:8px; padding:8px 12px; font-size:13px;
                   color:#0f172a; font-family:inherit; outline:none; background:#fff; box-sizing:border-box;"
            onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.1)'"
            onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none'"/>
          @if (isInvalid('age')) {
            <p style="margin:5px 0 0; font-size:11px; color:#ef4444;">Age must be between 0 and 120.</p>
          }
        </div>
      </div>


      <!-- Row 4 -->
      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:6px;" for="c-address">Address</label>
        <input id="c-address" type="text" formControlName="address" placeholder="123 Main St, New York, NY"
          style="width:100%; border:1px solid #e2e8f0; border-radius:8px; padding:8px 12px; font-size:13px;
                 color:#0f172a; font-family:inherit; outline:none; background:#fff; box-sizing:border-box;"
          onfocus="this.style.borderColor='#2563eb'; this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.1)'"
          onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none'"/>
      </div>

      <!-- Footer -->
      <div style="display:flex; gap:10px; padding-top:4px; border-top:1px solid #f1f5f9; margin-top:4px;">
        <button type="button" id="btn-cancel-create" (click)="onCancel()"
          style="flex:1; background:#fff; color:#475569; border:1px solid #e2e8f0; border-radius:8px;
                 padding:9px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;"
          onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#fff'">
          Cancel
        </button>
        <button type="submit" id="btn-submit-create" [disabled]="isSubmitting()"
          style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
                 background:#2563eb; color:#fff; border:none; border-radius:8px;
                 padding:9px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
                 transition:background 0.15s;"
          [style.opacity]="isSubmitting() ? '0.65' : '1'"
          onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
          @if (isSubmitting()) {
            <svg style="animation:spin 0.8s linear infinite;" width="14" height="14" fill="none" viewBox="0 0 24 24">
              <circle style="opacity:0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path style="opacity:0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Saving…
          } @else {
            Save Client
          }
        </button>
      </div>
    </form>
  </div>
</div>
